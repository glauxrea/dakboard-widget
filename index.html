<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown Strip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* ============================================================
     DAKBOARD COUNTDOWN WIDGET
     You do NOT edit this file anymore — edit events.txt instead.
     Single dark theme on purpose: it sits on the black DakBoard.
     ============================================================ */
  :root{
    --bg:#0b0b0d;            /* set to "transparent" to blend into the board */
    --fg:#ffffff;
    --muted:#9aa3ad;
    --row:#15161a;
    --edge:#23252b;
    --accent:#4ab8ff;       /* far-away */
    --soon:#ffb020;         /* within a week */
    --now:#ff5a4d;          /* today / tomorrow */
    --f-num:"Oswald","Arial Narrow",sans-serif;
    --f-txt:"Barlow",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--f-txt);
    padding:14px;display:flex;flex-direction:column;gap:12px;
    -webkit-font-smoothing:antialiased}
  .head{display:flex;align-items:baseline;justify-content:space-between;
    padding:0 4px 2px;border-bottom:1px solid var(--edge)}
  .head h1{font-family:var(--f-num);font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;font-size:clamp(15px,2.4vw,20px);color:var(--fg)}
  .head .today{font-family:var(--f-txt);font-size:13px;color:var(--muted);font-weight:500}
  .list{display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .evt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
    background:var(--row);border:1px solid var(--edge);border-left:4px solid var(--accent);
    border-radius:12px;padding:10px 16px}
  .evt.soon{border-left-color:var(--soon)}
  .evt.now{border-left-color:var(--now)}
  .count{display:flex;flex-direction:column;align-items:center;min-width:58px;line-height:1}
  .count .n{font-family:var(--f-num);font-weight:600;font-size:clamp(28px,5vw,42px);
    font-variant-numeric:tabular-nums}
  .count .u{font-family:var(--f-txt);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin-top:2px}
  .evt.now .count .n{color:var(--now)}
  .evt.soon .count .n{color:var(--soon)}
  .meta{min-width:0}
  .meta .title{font-size:clamp(15px,2.6vw,19px);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .when{font-size:13px;color:var(--muted);margin-top:2px}
  .emoji{font-size:clamp(20px,3.5vw,28px)}
  .empty{color:var(--muted);text-align:center;padding:24px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
  <div class="head">
    <h1 id="heading">Coming Up</h1>
    <span class="today" id="today"></span>
  </div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>

<script>
/* ============================================================
   You don't edit this file. Edit events.txt (one event per line).
   This script loads events.txt, re-checks it every 30 min, and
   recomputes day-counts at midnight.
   ============================================================ */
var HEADING='Coming Up', MAX_ROWS=8;
var EVENTS=[];
var WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,
  jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,
  nov:10,november:10,dec:11,december:11};
var WEEKDAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function parseMonthDay(t){
  t=t.trim();
  var m=t.match(/^(\d{1,2})[-\/](\d{1,2})$/);
  if(m) return {m:+m[1]-1, day:+m[2]};
  var p=t.replace(',',' ').split(/\s+/);
  var mo=MONTHS[(p[0]||'').toLowerCase()];
  if(mo!=null && p[1]) return {m:mo, day:parseInt(p[1],10)};
  return null;
}
function parseDate(t){
  t=t.trim();
  var m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return new Date(+m[3], +m[1]-1, +m[2]);
  var p=t.replace(',',' ').split(/\s+/);
  if(p.length>=3){
    var mo=MONTHS[(p[0]||'').toLowerCase()];
    if(mo!=null) return new Date(parseInt(p[2],10), mo, parseInt(p[1],10));
  }
  var d=new Date(t);
  return isNaN(d.getTime())?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function parseWhen(s){
  var low=s.trim().toLowerCase();
  if(low.indexOf('every ')===0){
    var wd=low.slice(6).trim().replace(/s$/,'');
    var i=WEEKDAYS.indexOf(wd);
    if(i>=0) return {weekday:i};
  }
  if(low.indexOf('yearly ')===0 || low.indexOf('every year ')===0){
    var md=parseMonthDay(low.replace(/^every year /,'').replace(/^yearly /,''));
    if(md) return {yearly:md};
  }
  var d=parseDate(s);
  if(d) return {date:d};
  return null;
}
function parseFile(text){
  return text.split(/\r?\n/).map(function(line){
    line=line.trim();
    if(!line || line.charAt(0)==='#') return null;
    var p=line.split('|');
    var title=(p[0]||'').trim(), when=(p[1]||'').trim(), emoji=(p[2]||'').trim();
    if(!title || !when) return null;
    var w=parseWhen(when);
    if(!w) return null;
    w.title=title; w.emoji=emoji; return w;
  }).filter(Boolean);
}
function nextDate(ev, today){
  if(ev.date) return ev.date;
  if(ev.yearly){ var y=today.getFullYear(); var d=new Date(y,ev.yearly.m,ev.yearly.day);
    if(d<today) d=new Date(y+1,ev.yearly.m,ev.yearly.day); return d; }
  if(typeof ev.weekday==='number'){ var diff=(ev.weekday-today.getDay()+7)%7;
    return new Date(today.getFullYear(),today.getMonth(),today.getDate()+diff); }
  return null;
}
function label(days){
  if(days<=0) return {n:'TODAY', u:'', cls:'now'};
  if(days===1) return {n:'1', u:'day', cls:'now'};
  if(days<=7)  return {n:String(days), u:'days', cls:'soon'};
  return {n:String(days), u:'days', cls:''};
}
function render(){
  var now=new Date(), today=startOfDay(now);
  document.getElementById('heading').textContent=HEADING;
  document.getElementById('today').textContent=
    WD[now.getDay()]+', '+MO[now.getMonth()]+' '+now.getDate();
  var rows=EVENTS.map(function(ev){
    var d=nextDate(ev, today); if(!d) return null;
    var days=Math.round((startOfDay(d)-today)/86400000);
    return {ev:ev, d:d, days:days};
  }).filter(Boolean).sort(function(a,b){return a.days-b.days;}).slice(0,MAX_ROWS);
  var list=document.getElementById('list');
  if(!rows.length){
    list.innerHTML='<div class="empty">No events yet.<br>Add lines to <b>events.txt</b> in the repo.</div>';
    return;
  }
  list.innerHTML='';
  rows.forEach(function(r){
    var L=label(r.days);
    var el=document.createElement('div');
    el.className='evt'+(L.cls?(' '+L.cls):'');
    var whenTxt = r.days<=0 ? 'Today'
      : r.days===1 ? 'Tomorrow · '+WD[r.d.getDay()]
      : WD[r.d.getDay()]+', '+MO[r.d.getMonth()]+' '+r.d.getDate();
    el.innerHTML=
      '<div class="count"><span class="n">'+L.n+'</span>'+(L.u?'<span class="u">'+L.u+'</span>':'')+'</div>'+
      '<div class="meta"><div class="title"></div><div class="when">'+whenTxt+'</div></div>'+
      '<div class="emoji">'+(r.ev.emoji||'')+'</div>';
    el.querySelector('.title').textContent=r.ev.title; // safe text, no HTML injection
    list.appendChild(el);
  });
}
function loadEvents(){
  fetch('events.txt?t='+Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(t){ EVENTS=parseFile(t); render(); })
    .catch(function(){
      document.getElementById('list').innerHTML=
        '<div class="empty">Could not load events.txt.</div>';
    });
}
loadEvents();
setInterval(loadEvents, 30*60*1000);     // re-read the file every 30 min
setInterval(render, 3600*1000);          // hourly safety recompute
(function midnight(){
  var n=new Date(), ms=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,5)-n;
  setTimeout(function(){ loadEvents(); setInterval(loadEvents, 86400*1000); }, ms);
})();
</script>
</body>
</html>
